name: Model folders
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify model folders and platform compatibility
        run: python tests/model_folder_checks.py
      - name: Verify singing on the original accompaniment
        run: python tests/test_resinging.py
